<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼车</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d0d0d;
  --card:#161616;
  --text:#f0f0f0;
  --sub:#888;
  --accent:#4ade80;
  --line:#2a2a2a;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh}
.nav{position:fixed;top:0;left:0;right:0;background:rgba(13,13,13,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;z-index:100}
.nav h1{font-size:18px;font-weight:600;letter-spacing:-.5px}
.user{background:var(--accent);color:#000;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer}
.top-tabs{display:flex;gap:16px;margin-left:24px}
.top-tabs button{background:none;border:none;color:var(--sub);font-size:14px;font-weight:500;cursor:pointer;padding:4px 0;border-bottom:2px solid transparent}
.top-tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.notice{background:linear-gradient(135deg,#1a1a1a 0%,#222 100%);border:1px solid #333;padding:16px 20px;margin:70px auto 20px;max-width:720px;border-radius:10px;font-size:14px;color:#ccc;line-height:1.7;text-align:center}
.notice strong{color:#4ade80;font-weight:600}
.hero{padding:40px 20px 40px;text-align:center;max-width:600px;margin:0 auto}
.hero h2{font-size:32px;font-weight:700;letter-spacing:-1px;margin-bottom:12px}
.hero p{color:var(--sub);font-size:15px;line-height:1.6}
.actions{display:flex;gap:12px;max-width:480px;margin:0 auto 40px;padding:0 20px}
.action{flex:1;background:var(--card);border:1px solid var(--line);padding:24px 16px;border-radius:12px;text-align:center;cursor:pointer;transition:border-color .2s}
.action:hover{border-color:var(--accent)}
.action .icon{font-size:24px;margin-bottom:8px}
.action .title{font-size:15px;font-weight:600}
.action .desc{font-size:12px;color:var(--sub);margin-top:4px}
.wrap{max-width:800px;margin:0 auto;padding:0 20px 100px}
.search{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:16px;outline:none}
.search:focus{border-color:var(--accent)}
.filters{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.filters::-webkit-scrollbar{display:none}
.f{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap}
.f.on{background:var(--accent);color:#000;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card-title{font-size:16px;font-weight:600;margin-bottom:8px}
.card-row{font-size:13px;color:var(--sub);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.need{color:var(--accent);font-size:13px;font-weight:500}
.btn{background:var(--accent);color:#000;border:none;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer}
.btn-o{background:transparent;border:1px solid var(--line);color:var(--sub);padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-box{background:#111;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto}
.modal-box h3{font-size:18px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.field input{width:100%;background:#0d0d0d;border:1px solid var(--line);color:var(--text);height:44px;border-radius:8px;padding:0 12px;font-size:15px}
.row{display:flex;gap:10px}
.row .field{flex:1}
.empty{text-align:center;padding:40px;color:var(--sub)}
#listSection{display:none}

@media(min-width:600px){
  .hero h2{font-size:42px}
  .grid{grid-template-columns:1fr 1fr}
  .modal-box{max-width:900px}
}
@media(min-width:900px){
  .wrap{max-width:1000px}
  .grid{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<nav class="nav">
  <div style="display:flex;align-items:center">
    <h1>拼车</h1>
    <div class="top-tabs">
      <button class="on" id="navSquare" onclick="go('square')">广场</button>
      <button id="navMy" onclick="go('my')">我的</button>
    </div>
  </div>
  <span class="user" id="userTag" onclick="openAuth()">登录</span>
</nav>

<div class="notice">
  <strong>欢迎来到深圳推理群专属拼车小站！</strong><br>
  这里专为本地推理爱好者设计，仅开放给深圳推理群的伙伴们使用～<br>
  温馨提示：本平台暂不支持情感向剧本的组队需求，感谢您的理解与支持！
</div>

<div class="hero">
  <h2>找到你的局</h2>
  <p>推理剧本拼车，找人组局</p>
</div>

<div class="actions">
  <div class="action" onclick="showList('carpool')">
    <div class="icon">\1f697</div>
    <div class="title">拼车中心</div>
    <div class="desc">加入已有的局</div>
  </div>
  <div class="action" onclick="openPub()">
    <div class="icon">\1f4dd</div>
    <div class="title">组局</div>
    <div class="desc">发起新的拼车</div>
  </div>
</div>

<div class="wrap" id="listSection">
  <input class="search" id="searchInput" placeholder="搜索剧本或地点" oninput="render()">
  <div class="filters">
    <span class="f on" onclick="setF('全部',this)">全部</span>
    <span class="f" onclick="setF('推理',this)">推理</span>
    <span class="f" onclick="setF('恐怖',this)">恐怖</span>
    <span class="f" onclick="setF('机制',this)">机制</span>
    <span class="f" onclick="setF('欢乐',this)">欢乐</span>
  </div>
  <div class="grid" id="list"></div>
</div>

<div id="authModal" class="modal" style="display:none">
  <div class="modal-box">
    <h3 id="authTitle">登录</h3>
    <form id="authForm">
      <div class="field"><label>账号</label><input id="authUser" required></div>
      <div class="field"><label>密码</label><input type="password" id="authPass" required></div>
      <button class="btn" style="width:100%;height:44px" type="submit" id="authBtn">登录</button>
    </form>
    <button class="btn-o" style="width:100%;margin-top:8px" onclick="demoLogin()">测试账号（跳过验证）</button>
    <p style="font-size:12px;color:var(--sub);margin-top:10px" id="authTip"></p>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn-o" style="flex:1" onclick="toggle()">切换注册</button>
      <button class="btn-o" style="flex:1" onclick="closeAuth()">取消</button>
    </div>
    <button class="btn-o" style="width:100%;margin-top:10px;display:none" id="logoutBtn" onclick="logout()">退出</button>
  </div>
</div>

<div id="pubModal" class="modal" style="display:none">
  <div class="modal-box" style="max-width:900px">
    <h3>发起拼车</h3>
    <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:20px">
      <div>
        <label style="font-size:12px;color:#888">粘贴群消息，例如：</label>
        <textarea id="pasteArea" style="width:100%;height:180px;background:#0d0d0d;border:1px solid #2a2a2a;color:#f0f0f0;border-radius:8px;padding:10px;font-size:13px;margin-top:6px" placeholder="《狗岛谋杀循环》
开局时间：2026.09.05 14:00
地点：炸蛋推理社
费用：98元/位
目前人数：5=1 陈大明
微信：wx_123456"></textarea>
        <button type="button" class="btn" style="width:100%;margin-top:8px" onclick="smartParse()">智能识别并自动填表</button>
      </div>
      <form id="pubForm">
        <div class="field"><label>剧本名称</label><input id="fName" required placeholder="例如：狗岛谋杀循环"></div>
        <div class="field"><label>开局时间</label><input id="fTime" required placeholder="例如：2026-09-05 14:00"></div>
        <div class="field"><label>开局地点</label><input id="fLoc" required placeholder="例如：炸蛋推理社"></div>
        <div class="row">
          <div class="field"><label>总需人数</label><input id="fTotal" type="number" required placeholder="5"></div>
          <div class="field"><label>当前已有</label><input id="fCur" type="number" required placeholder="4"></div>
        </div>
        <div class="row">
          <div class="field"><label>人均金额</label><input id="fPrice" placeholder="98 / AA"></div>
          <div class="field"><label>发起人</label><input id="fHost" placeholder="例如：陈大明"></div>
        </div>
        <div class="field"><label>标签</label><input id="fTags" placeholder="推理 硬核"></div>
        <div class="row">
          <div class="field">
            <label>微信号</label>
            <input id="fWx" placeholder="例如：wx_123456">
          </div>
          <div class="field">
            <label>群二维码（可选）</label>
            <input type="file" id="fGroup" accept="image/*" style="font-size:12px">
            <img id="groupPreview" style="max-width:80px;margin-top:6px;display:none;border-radius:4px">
          </div>
        </div>
        <p style="font-size:11px;color:#888;margin-bottom:8px">微信号或群二维码至少填一个</p>
        <button class="btn" style="width:100%;height:44px" type="submit">立即发布至广场</button>
      </form>
    </div>
    <button class="btn-o" style="width:100%;margin-top:12px" onclick="closePub()">取消</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://mfdeckoqqyvihvwzukus.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mZGVja29xcXl2aWh2d3p1a3VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1Nzc2NzQsImV4cCI6MjEwMzE1MzY3NH0.MDVvtjnq99N294og4lvH2oFCHuif8pdHIEMr4EYwl9Q';
let db, cars = [], filter = '全部', user = null, isReg = false, page = 'square';

const fake = [
  {id:9001, script_name:'无人生还', game_time:'今晚 19:30', location:'徐汇 · 密室空间', total_count:6, current_count:4, price:'98', host:'阿白', tags:['推理','硬核'], creator_id:null},
  {id:9002, script_name:'恐怖游轮', game_time:'明天 14:00', location:'静安 · 黑匣子', total_count:5, current_count:3, price:'AA', host:'夜行', tags:['恐怖'], creator_id:null},
  {id:9003, script_name:'年轮', game_time:'周六 15:00', location:'浦东 · 剧本社', total_count:7, current_count:5, price:'108', host:'林', tags:['机制','欢乐'], creator_id:null},
  {id:9004, script_name:'第七号嫌疑人', game_time:'今晚 20:00', location:'黄浦 · 老房子', total_count:6, current_count:2, price:'88', host:'侦探', tags:['推理'], creator_id:null}
];

function showList(m){
  document.getElementById('listSection').style.display='block';
  render();
  window.scrollTo({top:document.getElementById('listSection').offsetTop-20,behavior:'smooth'});
}

function openAuth(){document.getElementById('authModal').style.display='flex';upd()}
function closeAuth(){document.getElementById('authModal').style.display='none'}
function openPub(){if(!user)return openAuth();document.getElementById('pubModal').style.display='flex'}
function closePub(){document.getElementById('pubModal').style.display='none'}

function toggle(){
  isReg=!isReg;
  document.getElementById('authBtn').innerText=isReg?'注册':'登录';
  document.getElementById('authTitle').innerText=isReg?'注册':'登录';
  document.querySelector('#authForm + p + div button').innerText=isReg?'切换登录':'切换注册';
  document.getElementById('authTip').innerText='';
}

function upd(){
  const t=document.getElementById('userTag');
  const l=document.getElementById('logoutBtn');
  if(user){
    t.innerText=user.user_metadata?.username||user.email?.split('@')[0]||'已登录';
    l.style.display='block';
  }else{
    t.innerText='登录';
    l.style.display='none';
  }
}

async function init(){
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const{data:{session}}=await db.auth.getSession();
  if(session)user=session.user;
  db.auth.onAuthStateChange((_,s)=>{user=s?.user||null;upd();load()});
  upd();load();
}

document.getElementById('authForm').onsubmit=async e=>{
  e.preventDefault();
  const u=document.getElementById('authUser').value.trim();
  const p=document.getElementById('authPass').value;
  if(u.length<2||p.length<6){document.getElementById('authTip').innerText='账号≥2，密码≥6';return}
  const email=u+'@example.com';
  const btn=document.getElementById('authBtn');
  btn.disabled=true;btn.innerText='...';
  let err;
  if(isReg)({error:err}=await db.auth.signUp({email,password:p,options:{data:{username:u}}}));
  else ({error:err}=await db.auth.signInWithPassword({email,password:p}));
  btn.disabled=false;btn.innerText=isReg?'注册':'登录';
  if(err){document.getElementById('authTip').innerText=err.message;return}
  document.getElementById('authTip').innerText=isReg?'注册成功':'登录成功';
  setTimeout(closeAuth,500);
};

async function logout(){await db.auth.signOut();user=null;upd();closeAuth()}

async function load(){
  const{data}=await db.from('carpools').select('*').order('id',{ascending:false});
  cars=[...fake,...(data||[])];
  render();
}

function render(){
  if(document.getElementById('listSection').style.display==='none')return;
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  let list=cars;
  if(page==='my'){
    if(!user){document.getElementById('list').innerHTML='<div class="empty">请先登录</div>';return}
    list=list.filter(c=>c.creator_id===user.id);
  }
  list=list.filter(c=>{
    const t=((c.script_name||'')+(c.location||'')+(c.host||'')).toLowerCase();
    return(!q||t.includes(q))&&(filter==='全部'||(c.tags||[]).some(x=>String(x).includes(filter)));
  });
  const el=document.getElementById('list');
  el.innerHTML=list.length?'':'<div class="empty">暂无拼车</div>';
  list.forEach(c=>{
    const need=Math.max(0,(c.total_count||0)-(c.current_count||0));
    const mine=user&&c.creator_id===user.id;
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML=`
      <div class="card-title">${c.script_name||'未命名'}</div>
      <div class="card-row">\1f551 ${c.game_time||'-'}</div>
      <div class="card-row">\1f4cd ${c.location||'-'}</div>
      <div class="card-row">${c.price?'￥'+c.price+' · ':''}${c.host||'车头'}</div>
      <div class="card-bottom">
        <span class="need">${need>0?'还缺 '+need+' 人':'已满'}</span>
        ${page==='my'?'<button class="btn-o" onclick="del('+c.id+')">删除</button>':(need>0&&!mine?'<button class="btn" onclick="join('+c.id+')">上车</button>':'')}
      </div>
    `;
    el.appendChild(d);
  });
}

function join(id){if(!user)return openAuth();alert('已上车')}
async function del(id){
  if(!confirm('删除？'))return;
  await db.from('carpools').delete().eq('id',id).eq('creator_id',user.id);
  load();
}

function setF(f,el){
  filter=f;
  document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  render();
}

function go(p){
  page=p;
  document.getElementById('navSquare').classList.toggle('on',p==='square');
  document.getElementById('navMy').classList.toggle('on',p==='my');
  document.getElementById('listSection').style.display='block';
  if(p==='my'){
    document.querySelector('.hero').style.display='none';
    document.querySelector('.actions').style.display='none';
  }else{
    document.querySelector('.hero').style.display='block';
    document.querySelector('.actions').style.display='flex';
  }
  render();
}

document.getElementById('pubForm').onsubmit=async e=>{
  e.preventDefault();
  if(!user)return openAuth();
  if(!document.getElementById('fWx').value.trim()&&!document.getElementById('fGroup').files[0]){alert('微信号或群二维码至少填一个');return}
  const name=document.getElementById('fName').value.trim();
  if(['情感','沉浸','哭哭','演绎','立意','还泪'].some(k=>name.includes(k)))return alert('禁止情感类');
  const un=document.getElementById('fHost').value.trim()||user.user_metadata?.username||user.email?.split('@')[0]||'玩家';
  const payload={
    script_name:name,
    game_time:document.getElementById('fTime').value.trim(),
    location:document.getElementById('fLoc').value.trim(),
    total_count:+document.getElementById('fTotal').value,
    current_count:+document.getElementById('fCur').value,
    price:document.getElementById('fPrice').value.trim(),
    host:un,
    tags:document.getElementById('fTags').value.trim().split(/\s+/).filter(Boolean),
    members:[{name:un,isHost:true}],
    creator_id:user.id
  };
  const{error}=await db.from('carpools').insert([payload]);
  if(error)return alert(error.message);
  alert('发布成功');
  document.getElementById('pubForm').reset();
  closePub();
  go('my');
  showList('carpool');
  load();
};

function smartParse(){
  const t=document.getElementById('pasteArea').value;
  if(!t)return;
  const nameMatch=t.match(/《([^》]+)》/)||t.match(/剧本[：:]\s*([^\n]+)/);
  if(nameMatch)document.getElementById('fName').value=nameMatch[1].trim();
  const timeMatch=t.match(/时间[：:]\s*([^\n]+)/)||t.match(/开局时间[：:]\s*([^\n]+)/);
  if(timeMatch)document.getElementById('fTime').value=timeMatch[1].trim();
  const locMatch=t.match(/地点[：:]\s*([^\n]+)/);
  if(locMatch)document.getElementById('fLoc').value=locMatch[1].trim();
  const priceMatch=t.match(/费用[：:]\s*([^\n]+)/)||t.match(/金额[：:]\s*([^\n]+)/);
  if(priceMatch)document.getElementById('fPrice').value=priceMatch[1].trim();
  const numMatch=t.match(/人数[：:]\s*(\d+)/)||t.match(/目前人数[：:]\s*(\d+)/);
  if(numMatch)document.getElementById('fCur').value=numMatch[1];
  const hostMatch=t.match(/([一-龥]{2,4})(?=\s|$)/);
  if(hostMatch)document.getElementById('fHost').value=hostMatch[1];
  alert('已识别，请检查并补充');
}

function demoLogin(){
  user={id:'demo-user',user_metadata:{username:'测试用户'},email:'test@carpool.local'};
  upd();
  closeAuth();
  alert('已进入测试模式');
}

document.getElementById('fGroup').onchange=e=>{
  const f=e.target.files[0];
  if(f){const r=new FileReader();r.onload=()=>{document.getElementById('groupPreview').src=r.result;document.getElementById('groupPreview').style.display='block'};r.readAsDataURL(f)}
};

window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
