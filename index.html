<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CASE · 拼车</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0c0b0a;
  --surface:#161412;
  --card:#1c1916;
  --border:#3d372f;
  --line:#5a4f42;
  --text:#f2ebe3;
  --sub:#b5a89a;
  --accent:#a3483a;
  --accent-d:#7a3329;
  --warm:#e8dcc8;
  --gold:#c9a87a;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Songti SC",serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);min-height:100vh;color:var(--text);padding-bottom:100px;background-image:
  radial-gradient(circle at 15% 10%,rgba(163,72,58,.05) 0%,transparent 35%),
  radial-gradient(circle at 85% 90%,rgba(201,168,122,.03) 0%,transparent 40%)}
.header{background:rgba(12,11,10,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header-inner{max-width:760px;margin:0 auto;height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 18px}
.logo{font-size:14px;font-weight:500;letter-spacing:2.5px;color:var(--gold);display:flex;align-items:center;gap:8px}
.logo-mark{width:18px;height:18px;border:1.5px solid var(--gold);border-radius:50%;position:relative}
.logo-mark::after{content:'';position:absolute;right:-4px;bottom:-2px;width:7px;height:1.5px;background:var(--gold);transform:rotate(45deg)}
.nav{display:flex;gap:6px;align-items:center}
.nav-btn{background:transparent;border:none;color:var(--sub);padding:6px 14px;border-radius:4px;font-size:13px;cursor:pointer;letter-spacing:.5px}
.nav-btn.active{background:rgba(163,72,58,.15);color:var(--warm);border:1px solid rgba(163,72,58,.3)}
.user-tag{background:var(--accent);color:#fff;padding:6px 14px;border-radius:4px;font-size:13px;cursor:pointer;letter-spacing:.5px}
.main{max-width:760px;margin:0 auto;padding:18px}
.search-wrap{position:relative;margin-bottom:14px}
.search{width:100%;height:42px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:0 16px 0 40px;color:var(--text);font-size:14px;outline:none}
.search:focus{border-color:var(--line)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.6}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:var(--surface);border:1px solid var(--border);color:var(--sub);font-size:12px;padding:6px 14px;border-radius:2px;cursor:pointer;letter-spacing:.3px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:2px;padding:18px 18px 16px 22px;position:relative}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--accent),transparent 80%)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-title{font-size:16px;font-weight:500;color:var(--warm);letter-spacing:.4px}
.case-no{font-size:10px;color:var(--gold);letter-spacing:1.5px;opacity:.7}
.divider{height:1px;background:linear-gradient(to right,var(--line),transparent);margin:10px 0}
.card-meta{font-size:13px;color:var(--sub);line-height:1.75}
.meta-item{display:flex;align-items:center;gap:8px}
.meta-item svg{flex-shrink:0;opacity:.55}
.need{font-size:13px;font-weight:500;color:var(--accent);display:flex;align-items:center;gap:6px}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:2px;font-size:13px;cursor:pointer;letter-spacing:.5px}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--sub);padding:6px 12px;border-radius:2px;font-size:12px;cursor:pointer}
.fab{position:fixed;bottom:22px;right:22px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:22px;font-weight:300;box-shadow:0 4px 20px rgba(163,72,58,.35);z-index:90;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal-card{background:var(--surface);border-radius:8px 8px 0 0;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;border-top:1px solid var(--border)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;color:var(--sub);margin-bottom:5px;letter-spacing:.5px}
.form-group input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);height:40px;border-radius:2px;padding:0 12px;font-size:14px;outline:none}
.empty{text-align:center;padding:56px 16px;color:var(--sub);font-size:14px}
@media(min-width:700px){.modal{align-items:center}.modal-card{border-radius:8px;max-height:80vh}}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="logo"><div class="logo-mark"></div>CASE</div>
    <nav class="nav">
      <button class="nav-btn active" id="tabSquare" onclick="switchTab('square')">广场</button>
      <button class="nav-btn" id="tabMy" onclick="switchTab('my')">我的</button>
      <span class="user-tag" id="userTag" onclick="openAuth()">登录</span>
    </nav>
  </div>
</header>
<main class="main">
  <section id="pageSquare">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="search" id="searchInput" placeholder="搜索案件 / 地点" oninput="renderSquare()">
    </div>
    <div class="chips">
      <span class="chip active" onclick="setTag('全部',this)">全部</span>
      <span class="chip" onclick="setTag('推理',this)">推理</span>
      <span class="chip" onclick="setTag('恐怖',this)">恐怖</span>
      <span class="chip" onclick="setTag('机制',this)">机制</span>
      <span class="chip" onclick="setTag('欢乐',this)">欢乐</span>
    </div>
    <div class="grid" id="squareList"></div>
  </section>
  <section id="pageMy" style="display:none"><div class="grid" id="myList"></div></section>
</main>
<button class="fab" onclick="openPub()">+</button>

<div id="authModal" class="modal" style="display:none">
  <div class="modal-card">
    <h3 style="font-weight:500;margin-bottom:6px;color:var(--warm);letter-spacing:.5px" id="authTitle">登录</h3>
    <p style="font-size:12px;color:var(--sub);margin-bottom:18px">账号密码即可，案件记录跟账号走。</p>
    <form id="authForm">
      <div class="form-group"><label>账号</label><input id="authUser" required></div>
      <div class="form-group"><label>密码</label><input type="password" id="authPass" required></div>
      <button class="btn" style="width:100%;height:42px" type="submit" id="authBtn">登录</button>
    </form>
    <div style="font-size:12px;color:var(--sub);margin-top:10px" id="authTip"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-ghost" style="flex:1" onclick="toggleMode()">切换注册</button>
      <button class="btn-ghost" style="flex:1" onclick="closeAuth()">取消</button>
    </div>
    <button class="btn-ghost" style="width:100%;margin-top:8px;display:none" id="logoutBtn" onclick="logout()">退出</button>
  </div>
</div>

<div id="pubModal" class="modal" style="display:none">
  <div class="modal-card">
    <h3 style="font-weight:500;margin-bottom:14px;color:var(--warm);letter-spacing:.5px">发起拼车</h3>
    <form id="pubForm">
      <div class="form-group"><label>剧本名称</label><input id="fName" required></div>
      <div class="form-group"><label>开局时间</label><input id="fTime" required placeholder="今晚 19:00"></div>
      <div class="form-group"><label>地点</label><input id="fLoc" required></div>
      <div style="display:flex;gap:10px">
        <div class="form-group" style="flex:1"><label>总人数</label><input id="fTotal" type="number" required></div>
        <div class="form-group" style="flex:1"><label>已有人数</label><input id="fCur" type="number" required></div>
      </div>
      <div class="form-group"><label>人均费用</label><input id="fPrice" placeholder="98 / AA"></div>
      <div class="form-group"><label>标签</label><input id="fTags" placeholder="推理 硬核"></div>
      <button class="btn" style="width:100%;height:42px" type="submit">发布</button>
    </form>
    <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="closePub()">取消</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://mfdeckoqqyvihvwzukus.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mZGVja29xcXl2aWh2d3p1a3VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1Nzc2NzQsImV4cCI6MjEwMzE1MzY3NH0.MDVvtjnq99N294og4lvH2oFCHuif8pdHIEMr4EYwl9Q';
let db, cars = [], tag = '全部', currentUser = null, isRegister = false;

const fakeCars = [
  {id:9001, script_name:'无人生还', game_time:'今晚 19:30', location:'徐汇 · 密室空间', total_count:6, current_count:4, price:'98', host:'阿白', tags:['推理','硬核'], creator_id:null},
  {id:9002, script_name:'恐怖游轮', game_time:'明天 14:00', location:'静安 · 黑匣子', total_count:5, current_count:3, price:'AA', host:'夜行', tags:['恐怖'], creator_id:null},
  {id:9003, script_name:'年轮', game_time:'周六 15:00', location:'浦东 · 剧本社', total_count:7, current_count:5, price:'108', host:'林', tags:['机制','欢乐'], creator_id:null},
  {id:9004, script_name:'第七号嫌疑人', game_time:'今晚 20:00', location:'黄浦 · 老房子', total_count:6, current_count:2, price:'88', host:'侦探', tags:['推理'], creator_id:null}
];

function openAuth(){document.getElementById('authModal').style.display='flex';updateAuthUI()}
function closeAuth(){document.getElementById('authModal').style.display='none'}
function openPub(){if(!currentUser)return openAuth();document.getElementById('pubModal').style.display='flex'}
function closePub(){document.getElementById('pubModal').style.display='none'}

function toggleMode(){
  isRegister=!isRegister;
  document.getElementById('authBtn').innerText=isRegister?'注册':'登录';
  document.getElementById('authTitle').innerText=isRegister?'注册':'登录';
  document.querySelector('#authForm + div + div button').innerText=isRegister?'切换登录':'切换注册';
  document.getElementById('authTip').innerText='';
}

function updateAuthUI(){
  const tagEl=document.getElementById('userTag');
  const logoutBtn=document.getElementById('logoutBtn');
  if(currentUser){
    const name=currentUser.user_metadata?.username||currentUser.email?.split('@')[0]||'已登录';
    tagEl.innerText=name;
    logoutBtn.style.display='block';
    document.getElementById('authTip').innerHTML='已登录 '+name;
  }else{
    tagEl.innerText='登录';
    logoutBtn.style.display='none';
  }
}

async function init(){
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const{data:{session}}=await db.auth.getSession();
  if(session)currentUser=session.user;
  db.auth.onAuthStateChange((_,s)=>{currentUser=s?.user||null;updateAuthUI();loadCars()});
  updateAuthUI();
  loadCars();
}

document.getElementById('authForm').onsubmit=async e=>{
  e.preventDefault();
  const username=document.getElementById('authUser').value.trim();
  const password=document.getElementById('authPass').value;
  if(username.length<2||password.length<6){document.getElementById('authTip').innerText='账号≥2位，密码≥6位';return}
  const email=username+'@carpool.local';
  const btn=document.getElementById('authBtn');
  btn.disabled=true;btn.innerText='处理中...';
  let error;
  if(isRegister)({error}=await db.auth.signUp({email,password,options:{data:{username}}}));
  else ({error}=await db.auth.signInWithPassword({email,password}));
  btn.disabled=false;btn.innerText=isRegister?'注册':'登录';
  if(error){document.getElementById('authTip').innerText=error.message;return}
  document.getElementById('authTip').innerText=isRegister?'注册成功':'登录成功';
  setTimeout(closeAuth,600);
};

async function logout(){await db.auth.signOut();currentUser=null;updateAuthUI();closeAuth()}

async function loadCars(){
  const{data,error}=await db.from('carpools').select('*').order('id',{ascending:false});
  if(error)console.error(error);
  cars=[...fakeCars,...(data||[])];
  renderSquare();renderMy();
}

function renderSquare(){
  const q=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  const list=cars.filter(c=>{
    const text=((c.script_name||'')+(c.location||'')+(c.host||'')).toLowerCase();
    return(!q||text.includes(q))&&(tag==='全部'||(c.tags||[]).some(x=>String(x).includes(tag)));
  });
  const el=document.getElementById('squareList');
  el.innerHTML=list.length?'':'<div class="empty">暂无案件</div>';
  list.forEach((c,i)=>{
    const need=Math.max(0,(c.total_count||0)-(c.current_count||0));
    const isMine=currentUser&&c.creator_id===currentUser.id;
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`
      <div class="card-head">
        <div class="card-title">《${c.script_name||'未命名'}》</div>
        <div class="case-no">#${String(i+1).padStart(3,'0')}</div>
      </div>
      <div class="divider"></div>
      <div class="card-meta">
        <div class="meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${c.game_time||'-'}</div>
        <div class="meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s7-4.5 7-11a7 7 0 1 0-14 0c0 6.5 7 11 7 11z"/><circle cx="12" cy="10" r="2"/></svg>${c.location||'-'}</div>
        <div>${c.price?'￥'+c.price+' · ':''}${c.host||'车头'}</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
        <span class="need"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>${need>0?'还缺 '+need+' 人':'已满'}</span>
        ${need>0&&!isMine?'<button class="btn btn-sm" onclick="join('+c.id+')">上车</button>':''}
      </div>
    `;
    el.appendChild(div);
  });
}

function renderMy(){
  const el=document.getElementById('myList');
  if(!currentUser){el.innerHTML='<div class="empty">登录后查看我的案件</div>';return}
  const mine=cars.filter(c=>c.creator_id===currentUser.id);
  el.innerHTML=mine.length?'':'<div class="empty">还没有发起的拼车</div>';
  mine.forEach(c=>{
    const need=Math.max(0,(c.total_count||0)-(c.current_count||0));
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`
      <div class="card-title">《${c.script_name}》</div>
      <div class="divider"></div>
      <div class="card-meta">${c.game_time} · ${c.location}<br>还缺 ${need} 人</div>
      <button class="btn-ghost" style="margin-top:10px" onclick="deleteCar(${c.id})">删除</button>
    `;
    el.appendChild(div);
  });
}

function join(id){if(!currentUser)return openAuth();alert('已上车')}
async function deleteCar(id){
  if(!confirm('确定删除？'))return;
  const{error}=await db.from('carpools').delete().eq('id',id).eq('creator_id',currentUser.id);
  if(error)return alert(error.message);
  loadCars();
}

function setTag(t,el){
  tag=t;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderSquare();
}

function switchTab(name){
  document.getElementById('pageSquare').style.display=name==='square'?'block':'none';
  document.getElementById('pageMy').style.display=name==='my'?'block':'none';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+(name==='square'?'Square':'My')).classList.add('active');
}

document.getElementById('pubForm').onsubmit=async e=>{
  e.preventDefault();
  if(!currentUser)return openAuth();
  const name=document.getElementById('fName').value.trim();
  if(['情感','沉浸','哭哭','演绎','立意','还泪'].some(k=>name.includes(k)))return alert('禁止情感类');
  const username=currentUser.user_metadata?.username||currentUser.email?.split('@')[0]||'玩家';
  const payload={
    script_name:name,
    game_time:document.getElementById('fTime').value.trim(),
    location:document.getElementById('fLoc').value.trim(),
    total_count:+document.getElementById('fTotal').value,
    current_count:+document.getElementById('fCur').value,
    price:document.getElementById('fPrice').value.trim(),
    host:username,
    tags:document.getElementById('fTags').value.trim().split(/\s+/).filter(Boolean),
    members:[{name:username,isHost:true}],
    creator_id:currentUser.id
  };
  const{error}=await db.from('carpools').insert([payload]);
  if(error)return alert(error.message);
  alert('发布成功');
  document.getElementById('pubForm').reset();
  closePub();
  switchTab('my');
  loadCars();
};

window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
