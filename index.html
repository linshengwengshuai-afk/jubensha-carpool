<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼车</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d0d0d;
  --card:#161616;
  --text:#f0f0f0;
  --sub:#888;
  --accent:#4ade80;
  --line:#2a2a2a;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh}
.nav{background:#0d0d0d;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.nav h1{font-size:18px;font-weight:600;letter-spacing:-.5px}
.user{background:var(--accent);color:#000;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer}
.notice{background:#1a1a1a;border:1px solid #333;border-left:3px solid #f59e0b;padding:16px 20px;margin:16px 20px;border-radius:8px;font-size:14px;color:#ccc;line-height:1.6}
.notice strong{color:#f59e0b}
.hero{padding:60px 20px 40px;text-align:center;max-width:600px;margin:0 auto}
.hero h2{font-size:32px;font-weight:700;letter-spacing:-1px;margin-bottom:12px}
.hero p{color:var(--sub);font-size:15px;line-height:1.6}
.actions{display:flex;gap:12px;max-width:480px;margin:0 auto 40px;padding:0 20px}
.action{flex:1;background:var(--card);border:1px solid var(--line);padding:24px 16px;border-radius:12px;text-align:center;cursor:pointer}
.action:hover{border-color:var(--accent)}
.action .icon{font-size:24px;margin-bottom:8px}
.action .title{font-size:15px;font-weight:600}
.action .desc{font-size:12px;color:var(--sub);margin-top:4px}
.wrap{max-width:800px;margin:0 auto;padding:0 20px 100px}
.search{width:100%;max-width:600px;background:var(--card);border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:8px;font-size:14px;margin:0 auto 16px;outline:none;display:block}
.search:focus{border-color:var(--accent)}
.filters{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;justify-content:center}
.filters::-webkit-scrollbar{display:none}
.f{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap}
.f.on{background:var(--accent);color:#000;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card-title{font-size:16px;font-weight:600;margin-bottom:8px}
.card-row{font-size:13px;color:var(--sub);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.need{color:var(--accent);font-size:13px;font-weight:500}
.btn{background:var(--accent);color:#000;border:none;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer}
.btn-o{background:transparent;border:1px solid var(--line);color:var(--sub);padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer}
.top-tabs{display:flex;gap:16px;margin-left:24px}
.top-tabs button{background:none;border:none;color:var(--sub);font-size:14px;font-weight:500;cursor:pointer;padding:4px 0;border-bottom:2px solid transparent}
.top-tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-box{background:#111;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-box.wide{max-width:720px}
.pub-grid{display:flex;flex-direction:column;gap:16px}
@media(min-width:700px){
  .pub-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:20px}
}
.modal-box h3{font-size:18px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.field input{width:100%;background:#0d0d0d;border:1px solid var(--line);color:var(--text);height:44px;border-radius:8px;padding:0 12px;font-size:15px}
.row{display:flex;gap:10px}
.row .field{flex:1}
.empty{text-align:center;padding:60px;color:var(--sub)}
.my-subtabs{display:flex;gap:8px;margin-bottom:16px;justify-content:center}
.my-subtabs button{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:6px 16px;border-radius:20px;font-size:13px;cursor:pointer}
.my-subtabs button.on{background:var(--accent);color:#000;border-color:var(--accent)}
.member-list{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
.member-list .host{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c1c1c;border:1px solid #333;color:#ddd;padding:10px 16px;border-radius:999px;font-size:13px;z-index:400;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.btn:disabled{opacity:.55}
@media(max-width:699px){
  .nav{padding:12px 14px;gap:8px}
  .top-tabs{margin-left:0;gap:12px}
  .nav h1{font-size:15px}
  .hero{padding:32px 16px 20px}
  .hero h2{font-size:28px}
  .actions{flex-direction:column;max-width:100%;margin-bottom:24px}
  .action{padding:16px}
  .notice{margin:12px;padding:12px 14px;font-size:13px}
  .modal{align-items:flex-end;padding:0}
  .modal-box,.modal-box.wide{max-width:100%;width:100%;max-height:92vh;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .row{flex-direction:column;gap:0}
  #pasteArea{height:110px !important}
}
@media(min-width:600px){
  .hero h2{font-size:42px}
  .grid{grid-template-columns:1fr 1fr}
}
@media(min-width:900px){
  .wrap{max-width:1000px}
  .grid{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="top-tabs">
    <button class="on" id="navSquare" onclick="go('square')">广场</button>
    <button id="navMy" onclick="go('my')">我的</button>
  </div>
  <h1>拼车 <span style="color:#4ade80;font-size:12px">v4</span></h1>
  <span class="user" id="userTag" onclick="openAuth()">登录</span>
</nav>

<div class="notice">
  <strong>欢迎来到深圳推理群专属拼车小站！</strong><br>
  这里专为本地推理爱好者设计，仅开放给深圳推理群的伙伴们使用～<br>
  温馨提示：本平台暂不支持情感向剧本的组队需求，感谢您的理解与支持！
</div>
<div style="max-width:800px;margin:0 auto"><div class="hero">
  <h2>🔍 找到你的局</h2>
  <p>推理剧本拼车，找人组局</p>
</div>
</div>
<div class="actions">
  <div class="action" onclick="showList('carpool')">
    <div class="icon">🚗</div>
    <div class="title">拼车中心</div>
    <div class="desc">加入已有的局</div>
  </div>
  <div class="action" onclick="openPub()">
    <div class="icon">📝</div>
    <div class="title">组局</div>
    <div class="desc">发起新的拼车</div>
  </div>
  <div class="action" onclick="openDailyTarot()">
    <div class="icon">🔮</div>
    <div class="title">每日塔罗</div>
    <div class="desc">今日打本运势</div>
  </div>
</div>

<div class="wrap" id="listSection" style="display:none">
  <input class="search" id="searchInput" placeholder="搜索剧本或地点" oninput="render()">
  <div class="filters">
    <span class="f on" onclick="setF('全部',this)">全部</span>
    <span class="f" onclick="setF('推理',this)">推理</span>
    <span class="f" onclick="setF('恐怖',this)">恐怖</span>
    <span class="f" onclick="setF('机制',this)">机制</span>
    <span class="f" onclick="setF('欢乐',this)">欢乐</span>
  </div>
  <div class="grid" id="list"></div>
</div>

<!-- 登录/注册 -->
<div id="authModal" class="modal" style="display:none">
  <div class="modal-box">
    <h3 id="authTitle">登录</h3>
    <div id="authFormWrap">
      <form id="authForm">
        <div class="field"><label>邮箱</label><input id="authUser" type="email" required placeholder="请输入邮箱（注册时使用）"></div>
        <div class="field"><label>密码</label><input type="password" id="authPass" required placeholder="至少6位"></div>
        <button class="btn" style="width:100%;height:44px" type="submit" id="authBtn">登录</button>
      </form>
      <p style="font-size:12px;color:var(--sub);margin-top:8px;text-align:center">注册与登录均使用邮箱，请使用真实邮箱</p>
      <button class="btn-o" style="width:100%;margin-top:8px" onclick="demoLogin()">测试账号（跳过验证）</button>
      <p style="font-size:12px;color:var(--sub);margin-top:10px" id="authTip"></p>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn-o" style="flex:1" onclick="toggle()">切换注册</button>
        <button class="btn-o" style="flex:1" onclick="closeAuth()">取消</button>
      </div>
    </div>
    <div id="loggedInActions" style="display:none">
      <button class="btn" style="width:100%;height:44px;margin-bottom:8px" onclick="openProfile()">用户中心</button>
      <button class="btn-o" style="width:100%;height:44px" onclick="logout()">退出登录</button>
    </div>
  </div>
</div>

<!-- 用户中心：改用户名 + 绑定微信号（选填） -->
<div id="profileModal" class="modal" style="display:none">
  <div class="modal-box">
    <h3>用户中心</h3>
    <form id="profileForm">
      <div class="field"><label>用户名</label><input id="profileName" required placeholder="显示在车上的名字"></div>
      <div class="field"><label>微信号（选填）</label><input id="profileWx" placeholder="填写后上车/组局自动使用"></div>
      <button class="btn" style="width:100%;height:44px" type="submit">保存</button>
    </form>
    <button class="btn-o" style="width:100%;margin-top:8px" onclick="closeProfile()">关闭</button>
  </div>
</div>

<!-- 自定义确认/提示弹窗 -->
<div id="customModal" class="modal" style="display:none">
  <div class="modal-box" style="max-width:380px;text-align:center">
    <div style="font-size:28px;margin-bottom:8px">🔍</div>
    <h3 id="customModalTitle" style="margin-bottom:12px">提示</h3>
    <p id="customModalMsg" style="font-size:14px;line-height:1.6;color:#ccc;margin-bottom:16px"></p>
    <input id="customModalInput" style="display:none;width:100%;background:#0d0d0d;border:1px solid #2a2a2a;color:#f0f0f0;height:44px;border-radius:8px;padding:0 12px;font-size:15px;margin-bottom:16px">
    <div id="customModalActions" style="display:flex;gap:10px;justify-content:center"></div>
  </div>
</div>
<!-- 每日塔罗 -->
<div id="tarotModal" class="modal" style="display:none">
  <div class="modal-box" style="text-align:center;max-width:420px">
    <h3 style="margin-bottom:4px">每日塔罗 · 今日打本运势</h3>
    <div id="tarotCardName" style="font-size:24px;font-weight:700;color:var(--accent);margin:10px 0 4px"></div>
    <div id="tarotPosition" style="font-size:13px;color:var(--sub);margin-bottom:10px"></div>
    <div id="tarotKeywords" style="font-size:12px;color:#aaa;margin-bottom:12px"></div>
    <div id="tarotMeaning" style="font-size:14px;line-height:1.7;text-align:left;background:#0d0d0d;padding:14px;border-radius:8px;border:1px solid var(--line);margin-bottom:10px"></div>
    <div id="tarotAdvice" style="font-size:13px;line-height:1.6;text-align:left;color:#ccc;background:#111;padding:12px;border-radius:8px;border:1px dashed var(--line)"></div>
    <button class="btn" style="width:100%;margin-top:16px;height:44px" onclick="closeTarot()">收下运势</button>
  </div>
</div>

<!-- 发布拼车 -->
<div id="pubModal" class="modal" style="display:none">

    <h3>发起拼车</h3>

        <label style="font-size:12px;color:#888">粘贴群消息，例如：</label>

开局时间：2026.09.05 14:00
地点：炸蛋推理社
费用：98元/位
目前人数：5=1 陈大明
微信：wx_123456"></textarea>
        <button type="button" class="btn" style="width:100%;margin-top:8px" onclick="smartParse()">智能识别并自动填表</button>
      </div>
      <form id="pubForm">
        <div class="field"><label>剧本名称</label><input id="fName" required placeholder="例如：狗岛谋杀循环"></div>
        <div class="field"><label>开局时间</label><input id="fTime" required placeholder="例如：2026-09-05 14:00"></div>
        <div class="field"><label>开局地点</label><input id="fLoc" required placeholder="例如：炸蛋推理社"></div>
        <div class="row">

          <div class="field"><label>当前已有</label><input id="fCur" type="number" required placeholder="4"></div>
        </div>
        <div class="row">
          <div class="field"><label>人均金额</label><input id="fPrice" placeholder="98 / AA"></div>
          <div class="field"><label>发起人</label><input id="fHost" placeholder="例如：陈大明"></div>
        </div>
        <div class="field"><label>标签</label><input id="fTags" placeholder="推理 硬核"></div>
        <div class="field"><label>微信号（已绑定则自动带入）</label><input id="fWx" placeholder="例如：wx_123456"></div>
        <div class="field">
          <label>群二维码（可选）</label>
          <input type="file" id="fGroup" accept="image/*" style="font-size:12px">
          <img id="groupPreview" style="max-width:80px;margin-top:6px;display:none;border-radius:4px">
        </div>
        <button class="btn" style="width:100%;height:44px" type="submit">立即发布至广场</button>
      </form>
    </div>
    <button class="btn-o" style="width:100%;margin-top:12px" onclick="closePub()">取消</button>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>

// 微信号跟账号走（user_metadata.wechat），本地只做缓存
function getMyWx() {
  const meta = user?.user_metadata?.wechat || '';
  if (meta) return meta;
  return localStorage.getItem('MY_WX_' + (user?.id || 'guest')) || '';
}
async function setMyWx(wx) {
  if (!user) return;
  const val = (wx || '').trim();
  localStorage.setItem('MY_WX_' + user.id, val);
  user.user_metadata = user.user_metadata || {};
  user.user_metadata.wechat = val;
  if (user.id === 'demo-user' || !db) return;
  const { error } = await db.auth.updateUser({ data: { wechat: val } });
  if (error) customAlert(friendlyError(error));
}

function friendlyError(err) {
  const m = (err && err.message) || '';
  if (/fetch|network|Failed to fetch|Load failed/i.test(m)) return '网络不稳定，请检查网络后再试';
  if (/Invalid login credentials/i.test(m)) return '邮箱或密码不正确';
  if (/already registered|already been registered/i.test(m)) return '这个邮箱已经注册过了，直接登录即可';
  if (/Email not confirmed/i.test(m)) return '邮箱还没确认。如果已关闭确认，请稍后再试';
  if (/list_carpools|create_carpool|function public/i.test(m)) return '数据库权限还没升级。请先在 Supabase 的 SQL Editor 运行 rls.sql';
  return m || '操作失败，请稍后再试';
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.innerText = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
}
function hideToast() {
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { document.getElementById('toast').style.display = 'none'; }, 200);
}

// 判断是否是我发起的车
function isMyCreated(c) {
  return user && c.creator_id === user.id;
}

// 判断是否是我上过的车（优先用 user_id，兼容旧数据）
function isMyJoined(c) {
  if (!user || !Array.isArray(c.members)) return false;
  return c.members.some(m => !m.isHost && (
    m.user_id === user.id ||
    m.name === (user.user_metadata?.username || user.email?.split('@')[0]) ||
    (getMyWx() && m.contact === getMyWx())
  ));
}

function showList(m){
  document.getElementById('listSection').style.display='block';
  render();
  window.scrollTo({top:document.getElementById('listSection').offsetTop-20,behavior:'smooth'});
}

function openAuth(){document.getElementById('authModal').style.display='flex';upd()}
function closeAuth(){document.getElementById('authModal').style.display='none'}
function openPub(){
  if(!user)return openAuth();
  // 预填已保存的微信号
  const savedWx = getMyWx();
  if(savedWx) document.getElementById('fWx').value = savedWx;
  document.getElementById('pubModal').style.display='flex';
}
function closePub(){document.getElementById('pubModal').style.display='none'}
function openProfile(){
  if(!user)return openAuth();
  document.getElementById('profileName').value = user.user_metadata?.username || '';
  document.getElementById('profileWx').value = getMyWx();
  document.getElementById('profileModal').style.display='flex';
  closeAuth();
}
function closeProfile(){document.getElementById('profileModal').style.display='none'}

function toggle(){
  isReg=!isReg;
  document.getElementById('authBtn').innerText=isReg?'注册':'登录';
  document.getElementById('authTitle').innerText=isReg?'注册':'登录';
  document.querySelector('#authForm + p + div button').innerText=isReg?'切换登录':'切换注册';
  document.getElementById('authTip').innerText='';
}

function upd(){
  const t=document.getElementById('userTag');
  const formWrap=document.getElementById('authFormWrap');
  const loggedIn=document.getElementById('loggedInActions');
  if(user){
    t.innerText=user.user_metadata?.username||user.email?.split('@')[0]||'已登录';
    if(formWrap) formWrap.style.display='none';
    if(loggedIn) loggedIn.style.display='block';
    document.getElementById('authTitle').innerText='账户';
  }else{
    t.innerText='登录';
    if(formWrap) formWrap.style.display='block';
    if(loggedIn) loggedIn.style.display='none';
    document.getElementById('authTitle').innerText=isReg?'注册':'登录';
  }
}

function copyHostWx(id) {
  const c = cars.find(x => x.id == id);
  if (!c || !c.contact) return customAlert('没有可复制的微信号');
  const val = c.contact;
  const done = () => customAlert('已复制车头微信');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = val;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      done();
    } catch (e) {
      customAlert('复制失败，请长按微信号手动复制');
    }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(val).then(done).catch(fallback);
  } else {
    fallback();
  }
}

async function init(){
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: { session } } = await db.auth.getSession();
  if (session) user = session.user;
  else if (localStorage.getItem('DEMO_USER')) user = { id: 'demo-user', user_metadata: { username: '测试用户' }, email: 'test@carpool.local' };
  if (user && user.id !== 'demo-user' && !(user.user_metadata && user.user_metadata.wechat)) {
    const cached = localStorage.getItem('MY_WX_' + user.id);
    if (cached) setMyWx(cached);
  }
  db.auth.onAuthStateChange((_, s) => { user = s?.user || null; upd(); load(true); });
  upd();
  load();

  db.channel('carpools-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'carpools' }, () => {
      load(true);
    })
    .subscribe();
}

function render(){
  if(document.getElementById('listSection').style.display==='none')return;
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  let list=cars;
  if(page==='my'){
    if(!user){document.getElementById('list').innerHTML='<div class="empty">请先登录</div>';return}
    if(myTab==='joined'){
      list=list.filter(c=>isMyJoined(c));
    }else{
      list=list.filter(c=>isMyCreated(c));
    }
  }
  list=list.filter(c=>{
    const t=((c.script_name||'')+(c.location||'')+(c.host||'')).toLowerCase();
    return(!q||t.includes(q))&&(filter==='全部'||(c.tags||[]).some(x=>String(x).includes(filter)));
  });
  const el=document.getElementById('list');
  el.innerHTML=list.length?'':'<div class="empty">暂无拼车</div>';
  list.forEach(c=>{
    const need=Math.max(0,(c.total_count||0)-(c.current_count||0));
    const mine=isMyCreated(c);
    const joined=isMyJoined(c);
    const members=Array.isArray(c.members)?c.members:[];
    const d=document.createElement('div');
    d.className='card';
    let memberHtml='';
    if(page==='my'){
      memberHtml='<div class="member-list">';
      members.forEach((m, idx)=>{
        const showContact=mine||m.isHost;
        const kickBtn = (mine && !m.isHost) 
          ? ` <button class="btn-o" style="padding:2px 8px;font-size:11px;margin-left:6px" onclick="kickMember(${c.id}, ${idx})">移除</button>`
          : '';
        memberHtml+=`<div>${m.isHost?'<span class="host">车头</span> ':''}${m.name}${showContact&&m.contact? ' · '+m.contact:''}${kickBtn}</div>`;
      });
      memberHtml+='</div>';
    }
    d.innerHTML=`
      <div class="card-title">${c.script_name||'未命名'}</div>
      <div class="card-row">🕐 ${c.game_time||'-'}</div>
      <div class="card-row">📍 ${c.location||'-'}</div>
      <div class="card-row">💰 ${c.price||'面议'} · ${c.host||'车头'}</div>
      ${page==='my' && c.contact ? `<div class="card-row">💬 车头微信：${c.contact} <button class="btn-o" style="padding:2px 8px;font-size:11px" onclick="copyHostWx(${c.id})">复制</button></div>` : ''}
      ${c.qr_image ? `<div class="card-row"><button class="btn-o" style="padding:4px 10px;font-size:12px" onclick="viewQr('${c.id}')">📲 查看群二维码</button></div>` : ''}
      ${memberHtml}
      <div class="card-bottom">
        <span class="need">${need>0?'还缺 '+need+' 人':'已满'}</span>
        ${page==='my'&&mine?`
          <button class="btn-o" onclick="editCount(${c.id})">改人数</button>
          <button class="btn-o" onclick="del(${c.id})">解散</button>
        `:''}
        ${page==='my'&&joined&&!mine?`<button class="btn-o" onclick="leave(${c.id})">下车</button>`:''}
        ${page!=='my'&&need>0&&!mine&&!joined?`<button class="btn" onclick="join(${c.id})">上车</button>`:''}
      </div>
    `;
    el.appendChild(d);
  });
}

// 上车：校验微信号，更新 members 与 current_count
async function join(id){
  if(!user)return openAuth();
  const saved = getMyWx();
  if(!saved){
    customPrompt('请先绑定微信号（仅车头可见）', '', (val) => {
      if(!val || !val.trim()) return;
      setMyWx(val.trim());
      finishJoin(id, val.trim());
    });
    return;
  }
  finishJoin(id, saved);
}

async function finishJoin(id, wx){
  const c=cars.find(x=>x.id===id);
  if(!c)return;
  if(!c.creator_id && Number(c.id) >= 9000){customAlert('这是示例局，不能上车');return}
  if(c.current_count>=c.total_count){customAlert('已满');return}
  showToast('上车中…');
  const un = user.user_metadata?.username || user.email?.split('@')[0] || '玩家';
  let error;
  try {
    const res = await db.rpc('join_carpool', { p_id: id, p_name: un, p_contact: wx });
    error = res.error;
  } catch (e) { error = e; }
  hideToast();
  if (error) return customAlert(friendlyError(error));
  customAlert('已上车');
  load(true);
}

// 车头直接踢人（按索引）
async function kickMember(carId, idx) {
  const c = cars.find(x => x.id == carId);
  if (!c || !Array.isArray(c.members) || !c.members[idx] || c.members[idx].isHost) return;
  customConfirm(`确定移除「${c.members[idx].name}」？`, async () => {
    showToast('移除中…');
    let error;
    try {
      const res = await db.rpc('kick_carpool_member', { p_id: carId, p_index: idx });
      error = res.error;
    } catch (e) { error = e; }
    hideToast();
    if (error) return customAlert(friendlyError(error));
    customAlert('已移除');
    load(true);
  });
}

function smartParse(){
  const t=document.getElementById('pasteArea').value;
  if(!t)return;
  const nameMatch=t.match(/《([^》]+)》/)||t.match(/剧本[：:]\s*([^\n]+)/);
  if(nameMatch)document.getElementById('fName').value=nameMatch[1].trim();
  const timeMatch=t.match(/时间[：:]\s*([^\n]+)/)||t.match(/开局时间[：:]\s*([^\n]+)/);
  if(timeMatch)document.getElementById('fTime').value=timeMatch[1].trim();
  const locMatch=t.match(/地点[：:]\s*([^\n]+)/);
  if(locMatch)document.getElementById('fLoc').value=locMatch[1].trim();
  const priceMatch=t.match(/费用[：:]\s*([^\n]+)/)||t.match(/金额[：:]\s*([^\n]+)/);
  if(priceMatch)document.getElementById('fPrice').value=priceMatch[1].trim();
  const numMatch=t.match(/人数[：:]\s*(\d+)/)||t.match(/目前人数[：:]\s*(\d+)/);
  if(numMatch)document.getElementById('fCur').value=numMatch[1];
  const hostMatch=t.match(/([\u4e00-\u9fa5]{2,4})(?=\s|$)/);
  if(hostMatch)document.getElementById('fHost').value=hostMatch[1];
  const wxMatch=t.match(/微信[：:]\s*([^\n\s]+)/);
  if(wxMatch)document.getElementById('fWx').value=wxMatch[1].trim();
  customAlert('已识别，请检查并补充');
}

// ========== 自定义弹窗 ==========
function showCustomModal(title, msg, buttons) {
  document.getElementById('customModalTitle').innerText = title || '提示';
  document.getElementById('customModalMsg').innerText = msg || '';
  const input = document.getElementById('customModalInput');
  if (input && !input.dataset.keep) input.style.display = 'none';
  const actions = document.getElementById('customModalActions');
  actions.innerHTML = '';
  (buttons || [{text:'确定', onClick: closeCustomModal}]).forEach(btn => {
    const b = document.createElement('button');
    b.className = btn.primary ? 'btn' : 'btn-o';
    b.style.minWidth = '100px';
    b.style.height = '40px';
    b.innerText = btn.text;
    b.onclick = () => {
      closeCustomModal();
      if (btn.onClick) btn.onClick();
    };
    actions.appendChild(b);
  });
  document.getElementById('customModal').style.display = 'flex';
}
function closeCustomModal() {
  const input = document.getElementById('customModalInput');
  if (input) { input.style.display = 'none'; delete input.dataset.keep; }
  document.getElementById('customModal').style.display = 'none';
}

function customAlert(msg, title, onClose) {
  showCustomModal(title || '提示', msg, [{text:'确定', primary:true, onClick: onClose}]);
}

function customConfirm(msg, onYes, title) {
  showCustomModal(title || '确认', msg, [
    {text:'取消'},
    {text:'确定', primary:true, onClick: onYes}
  ]);
}

function customPrompt(msg, defaultValue, onOk, title) {
  const input = document.getElementById('customModalInput');
  input.dataset.keep = '1';
  input.style.display = 'block';
  input.value = defaultValue == null ? '' : String(defaultValue);
  showCustomModal(title || '请输入', msg, [
    {text:'取消'},
    {text:'确定', primary:true, onClick: () => { if (onOk) onOk(input.value); }}
  ]);
  setTimeout(() => input.focus(), 30);
}

  {name:'世界',kw:'完整 · 圆满 · 收官',up:'完整感强，适合长线本或收官局，容易有圆满体验。',rev:'还有未完成的部分，别急着结束讨论，多留一点时间。',advice:'适合把之前想玩但没玩到的本提上日程。'}
];

function getDailyTarot(){
  if(!user) return null;
  const d = new Date();
  const dateSeed = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  // 用用户 ID + 日期做种子，保证同一账号每天固定一张
  const userSeed = String(user.id).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const seed = (dateSeed + userSeed) % 999983;
  const idx = seed % TAROT.length;
  const reversed = (seed % 2) === 1;
  const card = TAROT[idx];
  return {
    name: card.name,
    position: reversed ? '逆位' : '正位',
    keywords: card.kw,
    meaning: reversed ? card.rev : card.up,
    advice: card.advice
  };
}

function openDailyTarot(){
  if(!user){
    customAlert('请先登录后再查看每日塔罗', '提示', openAuth);
    return;
  }
  const t = getDailyTarot();
  if(!t) return;
  document.getElementById('tarotCardName').innerText = '「' + t.name + '」';
  document.getElementById('tarotPosition').innerText = t.position;
  document.getElementById('tarotKeywords').innerText = t.keywords;
  document.getElementById('tarotMeaning').innerText = t.meaning;
  document.getElementById('tarotAdvice').innerText = '💡 今日建议：' + t.advice;
  document.getElementById('tarotModal').style.display = 'flex';
}
function closeTarot(){ document.getElementById('tarotModal').style.display = 'none'; }

let qrBase64 = ''; // 临时存储二维码

document.getElementById('fGroup').onchange = e => {
  const f = e.target.files[0];
  if (!f) { qrBase64 = ''; return; }
  const r = new FileReader();
  r.onload = () => {
    qrBase64 = r.result;
    document.getElementById('groupPreview').src = qrBase64;
    document.getElementById('groupPreview').style.display = 'block';
  };
  r.readAsDataURL(f);
};
